name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Verify code compiles
        run: |
          python -m compileall .

      - name: Lint (ruff)
        run: |
          ruff --version
          # TODO: enforce non-zero exit once codebase is fully lint-clean
          ruff check . --exit-zero

      - name: Test (pytest - smoke)
        run: |
          pytest -q
