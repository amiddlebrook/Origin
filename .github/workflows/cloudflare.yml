name: Test and deploy Origin
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: origin-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: npx wrangler d1 migrations apply DB --local
  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Wrangler
        run: npm install --no-audit --no-fund
      - name: Provision or reuse D1 using Wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }
          node scripts/set-d1-id.mjs
      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply DB --remote
      - name: Deploy Worker and static assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: Verify public production endpoints
        run: |
          set -euo pipefail
          site="https://origin-archive.averymiddlebrook2014.workers.dev"
          for attempt in 1 2 3 4 5; do
            if curl --max-time 15 -fsS -o /tmp/origin-health.json "$site/api/health" && grep -Fq '"status":"ok"' /tmp/origin-health.json; then
              echo "Origin health check passed: $site/api/health"
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "Origin public health check did not pass after 5 attempts."
              exit 1
            fi
            sleep 3
          done
          curl --max-time 15 -fsS "$site/" -o /tmp/origin-index.html
          grep -Eqi '<html' /tmp/origin-index.html
          echo "Origin public frontend is responding: $site/"
