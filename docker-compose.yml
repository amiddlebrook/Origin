version: '3.8'
services:
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
  web:
    build:
      context: .
      args:
        INSTALL_PLAYWRIGHT: 'false'
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./:/app
    ports:
      - '8000:8000'
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
  worker:
    build:
      context: .
      args:
        INSTALL_PLAYWRIGHT: 'false'
    command: celery -A celery_app.celery worker --loglevel=info -Q research
    volumes:
      - ./:/app
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
